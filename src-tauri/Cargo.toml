[package]
name = "pdfreader"
version = "2.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/MPomelo/PDFreader"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
serde_json = "=1.0.154"
url = "=2.5.8"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Networking_WinHttp"] }
tauri-plugin-single-instance = "=2.5.5"
