name: Attach verified PDFreader 2.0 release assets
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PDFreader-windows-x64-installer
          run-id: 45012191339
          github-token: ${{ github.token }}
          path: release-files/2.0.0
      - name: Verify and attach the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 45012191339 --repo MPomelo/PDFreader --json headSha,conclusion |
            jq -e '.headSha == "d54679829b241d01837baffb6a486d05f8ce20f5" and .conclusion == "success"'
          gh api repos/MPomelo/PDFreader/releases/454363433 |
            jq -e '.draft and (.prerelease | not) and .tag_name == "v2.0.0" and
              .target_commitish == "d54679829b241d01837baffb6a486d05f8ce20f5" and (.assets | length == 0)'
          cd release-files/2.0.0
          sha256sum -c SHA256SUMS.txt
          gh release upload v2.0.0 PDFreader_2.0.0_x64-setup.exe SHA256SUMS.txt release-manifest.json --repo MPomelo/PDFreader
