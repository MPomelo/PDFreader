name: Attach verified PDFreader 2.0.1 release assets
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PDFreader-windows-x64-installer
          run-id: 45014850601
          github-token: ${{ github.token }}
          path: release-files/2.0.1
      - name: Verify and attach the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 45014850601 --repo MPomelo/PDFreader --json headSha,conclusion |
            jq -e '.headSha == "c6c1918a403182fa3ae7a677cef747974a67836c" and .conclusion == "success"'
          gh api repos/MPomelo/PDFreader/releases/454381443 |
            jq -e '.draft and (.prerelease | not) and .tag_name == "v2.0.1" and
              .target_commitish == "c6c1918a403182fa3ae7a677cef747974a67836c" and (.assets | length == 0)'
          cd release-files/2.0.1
          sha256sum -c SHA256SUMS.txt
          gh release upload v2.0.1 PDFreader_2.0.1_x64-setup.exe SHA256SUMS.txt release-manifest.json --repo MPomelo/PDFreader
