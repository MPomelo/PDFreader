name: Attach verified PDFreader 2.0.3 release assets
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PDFreader-windows-x64-installer
          run-id: 45202914243
          github-token: ${{ github.token }}
          path: release-files/2.0.3
      - name: Verify and attach the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 45202914243 --repo MPomelo/PDFreader --json headSha,conclusion |
            jq -e '.headSha == "ef1a195b4a1e8bb90edd94e639eaaaaeb42eea14" and .conclusion == "success"'
          gh api repos/MPomelo/PDFreader/releases/455595311 |
            jq -e '.draft and (.prerelease | not) and .tag_name == "v2.0.3" and
              .target_commitish == "ef1a195b4a1e8bb90edd94e639eaaaaeb42eea14" and (.assets | length == 0)'
          export commit=ef1a195b4a1e8bb90edd94e639eaaaaeb42eea14
          export run=45202914243 installer=PDFreader_2.0.3_x64-setup.exe
          cd release-files/2.0.3
          mkdir assets
          mv "$installer" assets/
          7z t "assets/$installer"
          7z x -y -overify "assets/$installer" pdfreader.exe LICENSE.txt '*/Runtime-Rust-Notices.txt'
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import hashlib, json, os, struct

          installer = Path('assets') / os.environ['installer']
          payload = Path('verify/pdfreader.exe').read_bytes()
          offset = struct.unpack_from('<I', payload, 0x3c)[0]
          assert payload[offset:offset + 4] == b'PE\x00\x00'
          assert struct.unpack_from('<H', payload, offset + 4)[0] == 0x8664
          assert payload.split(b'__TAURI_BUNDLE_TYPE_VAR_', 1)[1][:3] == b'NSS'
          assert '2.0.3'.encode('utf-16le') in payload
          assert any('========== libloading 0.8.9' in p.read_text(encoding='utf-8') for p in Path('verify').rglob('Runtime-Rust-Notices.txt'))
          sha = hashlib.sha256(installer.read_bytes()).hexdigest()
          source = os.environ['commit']
          installer.with_name('SHA256SUMS.txt').write_text(f'{sha}  {installer.name}\n')
          manifest = {
              'version': '2.0.3',
              'tag': 'v2.0.3',
              'date': datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat(),
              'platform': 'windows-x64',
              'status': 'stable',
              'repository': 'https://github.com/MPomelo/PDFreader',
              'artifacts': [{
                  'file': installer.name, 'bytes': installer.stat().st_size, 'sha256': sha, 'codeSignature': 'unsigned',
              }],
              'sourceCommit': source,
              'continuousIntegration': {
                  'status': 'success',
                  'url': f"https://github.com/MPomelo/PDFreader/actions/runs/{os.environ['run']}",
                  'commit': source,
              },
              'checks': {
                  'windowsCiRegressionsAndBuild': 'passed',
                  'windowsSilentInstallAndUninstall': 'passed',
                  'installerArchiveAndVersion': 'passed',
              },
          }
          installer.with_name('release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cd assets
          sha256sum -c SHA256SUMS.txt
          gh release upload v2.0.3 PDFreader_2.0.3_x64-setup.exe SHA256SUMS.txt release-manifest.json --repo MPomelo/PDFreader
