name: Attach verified PDFreader 2.0.2 release assets
on: workflow_dispatch
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PDFreader-windows-x64-installer
          run-id: 45139498661
          github-token: ${{ github.token }}
          path: release-files/2.0.2
      - name: Verify and attach the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 45139498661 --repo MPomelo/PDFreader --json headSha,conclusion |
            jq -e '.headSha == "afa10590e56c8512c4c86850138573a6ff13501e" and .conclusion == "success"'
          gh api repos/MPomelo/PDFreader/releases/455162980 |
            jq -e '.draft and (.prerelease | not) and .tag_name == "v2.0.2" and
              .target_commitish == "afa10590e56c8512c4c86850138573a6ff13501e" and (.assets | length == 0)'
          cd release-files/2.0.2
          sha256sum -c SHA256SUMS.txt
          gh release upload v2.0.2 PDFreader_2.0.2_x64-setup.exe SHA256SUMS.txt release-manifest.json --repo MPomelo/PDFreader
